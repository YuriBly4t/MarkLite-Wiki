<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Note • MarkLite Wiki</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2'><path d='M12 20h9'/><path d='M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z'/></svg>">
  <style>
    .shared-container {
      max-width: 820px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }
    .shared-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.25rem;
      margin-bottom: 2rem;
    }
    .shared-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .shared-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
      line-height: 1.25;
    }
    .shared-tag-pill {
      background: var(--bg-tertiary);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      color: var(--accent);
    }
    .folder-notes-nav {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-bottom: 2rem;
    }
    .folder-note-link {
      display: block;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }
    .folder-note-link:hover, .folder-note-link.active {
      background: var(--accent-light);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="shared-container">
    <div class="shared-header">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <span>MarkLite Wiki</span>
        <span style="font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 9999px; background: var(--bg-tertiary); color: var(--text-muted);">Shared Document</span>
      </div>

      <div style="display: flex; gap: 0.5rem;">
        <button id="themeToggleBtn" class="btn btn-ghost btn-icon" title="Toggle Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="/login" class="btn btn-secondary btn-sm">Sign In</a>
      </div>
    </div>

    <div id="loading" style="text-align: center; padding: 4rem 1rem; color: var(--text-muted);">
      Loading shared content...
    </div>

    <div id="errorBox" class="alert alert-error hidden" style="margin-top: 2rem;"></div>

    <div id="contentArea" class="hidden">
      <!-- Folder navigation if shared item is a folder -->
      <div id="folderNav" class="folder-notes-nav hidden">
        <h4 style="font-size: 0.9rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;">Notes in this shared folder</h4>
        <div id="folderNotesList"></div>
      </div>

      <h1 id="sharedTitle" class="shared-title"></h1>
      <div id="sharedMeta" class="shared-meta"></div>
      <div id="sharedTags" style="display: flex; gap: 0.4rem; margin: 0.75rem 0 1.5rem;"></div>

      <article id="sharedBody" class="markdown-body" style="margin-top: 2rem;"></article>
    </div>
  </div>

  <script src="/js/markdown.js"></script>
  <script>
    // Theme toggle
    const savedTheme = localStorage.getItem('wiki_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', savedTheme);

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('wiki_theme', next);
    });

    // Extract token from URL path (/shared/<token>) or query (?token=...)
    const pathParts = window.location.pathname.split('/');
    let token = pathParts[pathParts.length - 1];
    if (!token || token === 'shared' || token === 'shared.html') {
      const urlParams = new URLSearchParams(window.location.search);
      token = urlParams.get('token');
    }

    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('errorBox');
    const contentArea = document.getElementById('contentArea');

    if (!token) {
      loading.classList.add('hidden');
      errorBox.textContent = 'Invalid or missing share link token.';
      errorBox.classList.remove('hidden');
    } else {
      fetch(`/api/shares/public/${token}`)
        .then(r => {
          if (!r.ok) throw new Error('Shared document not found or link has expired.');
          return r.json();
        })
        .then(res => {
          loading.classList.add('hidden');
          contentArea.classList.remove('hidden');

          if (res.type === 'note') {
            renderNote(res.data);
          } else if (res.type === 'folder') {
            renderFolder(res.data);
          }
        })
        .catch(err => {
          loading.classList.add('hidden');
          errorBox.textContent = err.message;
          errorBox.classList.remove('hidden');
        });
    }

    function renderNote(note) {
      document.title = `${note.title} • MarkLite Wiki`;
      document.getElementById('sharedTitle').textContent = note.title;
      document.getElementById('sharedMeta').innerHTML = `
        <span>Shared by <b>${escapeHtml(note.author)}</b></span>
        <span>Last updated: ${new Date(note.updated_at).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' })}</span>
      `;

      const tagsContainer = document.getElementById('sharedTags');
      tagsContainer.innerHTML = (note.tags || []).map(t => `<span class="shared-tag-pill">#${escapeHtml(t)}</span>`).join('');

      document.getElementById('sharedBody').innerHTML = window.WikiMarkdown.render(note.content || '');
    }

    function renderFolder(folder) {
      document.title = `Folder: ${folder.name} • MarkLite Wiki`;
      const nav = document.getElementById('folderNav');
      nav.classList.remove('hidden');

      const list = document.getElementById('folderNotesList');
      list.innerHTML = '';

      if (!folder.notes || folder.notes.length === 0) {
        list.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">This folder is currently empty.</p>';
        document.getElementById('sharedTitle').textContent = folder.name;
        document.getElementById('sharedBody').innerHTML = '';
        return;
      }

      folder.notes.forEach((n, idx) => {
        const link = document.createElement('a');
        link.className = `folder-note-link ${idx === 0 ? 'active' : ''}`;
        link.textContent = `📝 ${n.title}`;
        link.addEventListener('click', () => {
          document.querySelectorAll('.folder-note-link').forEach(el => el.classList.remove('active'));
          link.classList.add('active');
          renderNote({ ...n, author: folder.author });
        });
        list.appendChild(link);
      });

      // Display first note
      renderNote({ ...folder.notes[0], author: folder.author });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
