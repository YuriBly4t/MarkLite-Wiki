<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup • MarkLite Wiki</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2'><path d='M12 20h9'/><path d='M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z'/></svg>">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </div>
      <h2>Initial Setup</h2>
      <p class="auth-sub">Welcome to your personal Markdown wiki. Create your administrator account to get started.</p>
    </div>

    <div id="alertBox" class="alert hidden"></div>

    <form id="setupForm" class="auth-form">
      <div class="form-group">
        <label for="username">Administrator Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. admin" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password (min. 6 characters)</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="passwordConfirm">Confirm Password</label>
        <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="••••••••" required autocomplete="new-password">
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
        Create Account & Get Started
      </button>
    </form>
    
    <div class="auth-footer">
      <span>🔒 Self-hosted & encrypted on your server</span><br>
      <span style="font-size: 0.72rem; opacity: 0.7;">⚠️ 100% AI-generated code (not manually audited)</span>
    </div>
  </div>

  <script>
    // Check if setup is still required
    fetch('/api/auth/status')
      .then(r => r.json())
      .then(data => {
        if (!data.needsSetup) {
          window.location.href = '/login';
        }
      })
      .catch(() => {});

    const form = document.getElementById('setupForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
      alertBox.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('passwordConfirm').value;

      if (username.length < 3) {
        showAlert('Username must be at least 3 characters long.');
        return;
      }

      if (password.length < 6) {
        showAlert('Password must be at least 6 characters long.');
        return;
      }

      if (password !== confirm) {
        showAlert('Passwords do not match.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Setting up...';

      try {
        const res = await fetch('/api/auth/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Setup failed');
        }

        showAlert('Setup successful! Redirecting...', false);
        setTimeout(() => {
          window.location.href = '/';
        }, 1000);

      } catch (err) {
        showAlert(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account & Get Started';
      }
    });
  </script>
</body>
</html>
