services:
  wiki:
    build:
      context: .
      dockerfile: Dockerfile
    image: wikialternative:latest
    container_name: wikialternative
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-change_this_secret_in_env_file}
      - MAX_UPLOAD_SIZE_MB=25
    volumes:
      - ./data:/app/data

